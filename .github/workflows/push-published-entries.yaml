name: "[Reusable workflows] push published entries"

on:
  workflow_call:
    inputs:
      runner:
        required: false
        default: ubuntu-latest
        type: string
      sign_commits:
        required: false
        default: false
        type: boolean
    secrets:
      OWNER_API_KEY:
        required: true
      COMMIT_TOKEN:
        required: false

jobs:
  upload-images:
    if: github.event.pull_request.merged == false
    uses: hatena/hatenablog-workflows/.github/workflows/upload-images.yaml@d96c1ea3914d647ff9caade1881163be9d58b915
    with:
      runner: ${{ inputs.runner }}
      sign_commits: ${{ inputs.sign_commits }}
    secrets:
      OWNER_API_KEY: ${{ secrets.OWNER_API_KEY }}
      COMMIT_TOKEN: ${{ secrets.COMMIT_TOKEN }}
