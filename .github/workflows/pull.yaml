name: "[Reusable workflows] pull from hatenablog"

on:
  workflow_call:
    inputs:
      BLOG_DOMAIN:
        required: true
        type: string
      runner:
        required: false
        default: ubuntu-latest
        type: string
      sign_commits:
        required: false
        default: false
        type: boolean
      app_id:
        required: false
        default: ""
        type: string
    secrets:
      OWNER_API_KEY:
        required: true
      APP_PRIVATE_KEY:
        required: false
      COMMIT_TOKEN:
        required: false

jobs:
  pull:
    runs-on: ${{ inputs.runner }}
    env:
      BLOGSYNC_PASSWORD: ${{ secrets.OWNER_API_KEY }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: inputs.app_id != ''
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: resolve working directory
        id: working-directory
        uses: hatena/hatenablog-workflows/.github/actions/resolve-working-directory@d96c1ea3914d647ff9caade1881163be9d58b915
      - name: setup
        uses: hatena/hatenablog-workflows/.github/actions/setup@d96c1ea3914d647ff9caade1881163be9d58b915 
      - name: set blog domain
        id: set-domain
        run: |
          domain=${{ inputs.BLOG_DOMAIN }}
          echo "BLOG_DOMAIN=$(echo $domain | tr -d '\n\r ')" >> "$GITHUB_OUTPUT"
      - name: pull
        run: |
          blogsync pull ${{ steps.set-domain.outputs.BLOG_DOMAIN }}
        working-directory: ${{ steps.working-directory.outputs.working_directory }}
      - name: delete draft files
        run: |
          git ls-files -zmo --exclude-standard -- '*.md' | while IFS= read -r -d '' f; do
            if [[ -f "$f" ]] && [[ -n "$(yq --front-matter=extract 'select(.Draft == true)' "$f" 2>/dev/null)" ]]; then
              rm "$f"
            fi
          done
        working-directory: ${{ steps.working-directory.outputs.working_directory }}
      - name: create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: blogsync pull
          branch: blogsync-pull
          commit-message: |
            blogsync pull
          body: |
            blogsync pull
          labels: |
            skip-push
          delete-branch: true
          sign-commits: ${{ inputs.sign_commits }}
          token: ${{ steps.app-token.outputs.token || secrets.COMMIT_TOKEN || github.token }}
